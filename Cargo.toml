[package]
authors = ["Artavazd Balaian <reasyu@gmail.com>"]
edition = "2024"
license = "MIT"
name = "polytls"
readme = "README.md"
rust-version = "1.96.1"
version = "0.1.0"

[dependencies]
boring = { version = "5.1.0" }
boring-sys = { version = "5.1.0" }
brotli = "8"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
foreign-types = "0.5"
gethostname = "1.1.0"
httparse = "1"
local-ip-address = "0.6.13"
memchr = "2"
opentelemetry = "0.32.0"
opentelemetry-appender-tracing = "0.32.0"
opentelemetry-otlp = "0.32.0"
opentelemetry-resource-detectors = "0.11.0"
opentelemetry-semantic-conventions = "0.32.1"
opentelemetry_sdk = {  version = "0.32.1", features = ["default", "spec_unstable_metrics_views"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-boring = { version = "5.0.0"}
tokio-util = { version = "0.7", features = ["codec"] }
toml = "1.1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zstd = "0.13"

[dev-dependencies]
rand = "0.10.2"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
scudo = "0.1"

[profile.release]
debug = true
